    unit: "s"
    display_unit: "s"
    display_scale: 1
    format: "%.5g"
    integer: false
    allow_infinity: false
    source: "Virtual DLTS controls"
    note: "Protocol / processing setting. Ctrl+click for exact entry. Numerical range is not a physical qualification."
