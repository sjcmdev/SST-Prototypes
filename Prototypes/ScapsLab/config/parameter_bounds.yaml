# ScapsLab parameter bounds, schema 1. SI bounds; eV, nm and cm-based coefficients are display/engine units only.
# Override only changed keys/fields at <user settings>/scapslab/parameter_bounds.yaml.
# hard limits are inclusive numerical domains; soft limits describe typical devices.
# References: https://scaps.elis.ugent.be/SCAPS%20manual%20most%20recent.pdf
# https://www.ioffe.ru/SVA/NSM/index.html
# Local manual: references/PyScaps/docs/scaps-manual/03-solar-cell-definition.md and 05-single-shot.md.
# All estimates are explicit; hard maxima do not certify model accuracy at extremes.
# +infinity is allowed only for named ideal/open/optical sentinels; NaN is never valid.
schema_version: 1
parameters:
